<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">燃油系统概念流向</title><desc id="desc">油箱与吸油管；水分离器；粗滤；精滤；低压供油；高压泵／控制阀；共轨／压力反馈；喷油器。回油返回低压侧／油箱；粗精滤和低压泵顺序随机型配置变化。高压侧禁止松管试油。</desc><rect width="960" height="410" rx="14" fill="#fff"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="40" font-size="23" font-weight="700" fill="#17324a">燃油系统概念流向</text><text x="24" y="65" font-size="14" fill="#597083">识别与信息整理示意；不是装配图，不含设定值。</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#31759d"/></marker></defs><path d="M232 131h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M464 131h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M696 131h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M232 276h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M464 276h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M696 276h22" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M824 168v34H128v35" fill="none" stroke="#31759d" stroke-width="2"  marker-end="url(#arrow)"/><path d="M824 313v31H12V78H128v14" fill="none" stroke="#977035" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g><rect x="24" y="94" width="208" height="74" rx="10" fill="#edf5fc" stroke="#98b4c9"/><text x="128" y="120" text-anchor="middle" font-size="13" fill="#526c83">1</text><text x="128" y="146" text-anchor="middle" font-size="16" fill="#17324a">油箱与吸油管</text></g><g><rect x="256" y="94" width="208" height="74" rx="10" fill="#edf5fc" stroke="#98b4c9"/><text x="360" y="120" text-anchor="middle" font-size="13" fill="#526c83">2</text><text x="360" y="146" text-anchor="middle" font-size="16" fill="#17324a">水分离器</text></g><g><rect x="488" y="94" width="208" height="74" rx="10" fill="#edf5fc" stroke="#98b4c9"/><text x="592" y="120" text-anchor="middle" font-size="13" fill="#526c83">3</text><text x="592" y="146" text-anchor="middle" font-size="16" fill="#17324a">粗滤</text></g><g><rect x="720" y="94" width="208" height="74" rx="10" fill="#edf5fc" stroke="#98b4c9"/><text x="824" y="120" text-anchor="middle" font-size="13" fill="#526c83">4</text><text x="824" y="146" text-anchor="middle" font-size="16" fill="#17324a">精滤</text></g><g><rect x="24" y="239" width="208" height="74" rx="10" fill="#eaf4f1" stroke="#98b4c9"/><text x="128" y="265" text-anchor="middle" font-size="13" fill="#526c83">5</text><text x="128" y="291" text-anchor="middle" font-size="16" fill="#17324a">低压供油</text></g><g><rect x="256" y="239" width="208" height="74" rx="10" fill="#eaf4f1" stroke="#98b4c9"/><text x="360" y="265" text-anchor="middle" font-size="13" fill="#526c83">6</text><text x="360" y="291" text-anchor="middle" font-size="16" fill="#17324a">高压泵／控制阀</text></g><g><rect x="488" y="239" width="208" height="74" rx="10" fill="#eaf4f1" stroke="#98b4c9"/><text x="592" y="265" text-anchor="middle" font-size="13" fill="#526c83">7</text><text x="592" y="291" text-anchor="middle" font-size="16" fill="#17324a">共轨／压力反馈</text></g><g><rect x="720" y="239" width="208" height="74" rx="10" fill="#eaf4f1" stroke="#98b4c9"/><text x="824" y="265" text-anchor="middle" font-size="13" fill="#526c83">8</text><text x="824" y="291" text-anchor="middle" font-size="16" fill="#17324a">喷油器</text></g><text x="24" y="378" font-size="13" fill="#52667a">回油返回低压侧／油箱；粗精滤和低压泵顺序随机型配置变化。高压侧禁止松管试油。</text></g></svg>