<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">电起动主回路与许可支路示意</title><desc id="desc">主电流从电瓶经主开关、主电缆和电磁开关大电流触点到起动机，经搭铁回电瓶。控制支路通过保护、起动许可和继电器控制电磁开关。实际接线以本机电路图为准。</desc><rect width="960" height="340" rx="12" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28669a"/></marker></defs><g font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="15" fill="#17324a"><text x="24" y="36" font-size="22" font-weight="700">电起动：大电流回路与起动许可分开检查</text><text x="24" y="64" font-size="13" fill="#52667a">仅示意两条检查路径，不含端子定义和设定值；不是接线或跨接操作说明。</text><rect x="30" y="100" width="190" height="65" rx="8" fill="#edf5fc" stroke="#9fbad1"/><text x="125" y="139" text-anchor="middle">电瓶</text><rect x="265" y="100" width="190" height="65" rx="8" fill="#edf5fc" stroke="#9fbad1"/><text x="360" y="139" text-anchor="middle">主开关／电缆</text><rect x="500" y="100" width="190" height="65" rx="8" fill="#edf5fc" stroke="#9fbad1"/><text x="595" y="139" text-anchor="middle">电磁开关触点</text><rect x="735" y="100" width="190" height="65" rx="8" fill="#edf5fc" stroke="#9fbad1"/><text x="830" y="139" text-anchor="middle">起动机</text><path d="M220 132h43" fill="none" stroke="#28669a" stroke-width="2" marker-end="url(#a)"/><path d="M455 132h43" fill="none" stroke="#28669a" stroke-width="2" marker-end="url(#a)"/><path d="M690 132h43" fill="none" stroke="#28669a" stroke-width="2" marker-end="url(#a)"/><path d="M830 165v37H125v-35" fill="none" stroke="#28669a" stroke-width="2" marker-end="url(#a)"/><text x="460" y="193" text-anchor="middle" font-size="13">搭铁／负极回路：同样检查带载压降</text><rect x="265" y="236" width="300" height="52" rx="8" fill="#e6f2ef" stroke="#9fbad1"/><text x="415" y="267" text-anchor="middle">控制保护 → 起动许可／继电器</text><path d="M125 165v97h138" fill="none" stroke="#977035" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a)"/><path d="M565 262h30v-95" fill="none" stroke="#977035" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a)"/><text x="24" y="320" font-size="13" fill="#52667a">失去起动许可时不应直接判断起动机损坏；禁止旁路保护或用工具跨接试起动。</text></g></svg>